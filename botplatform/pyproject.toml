[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botplatform"
version = "0.1.0"
description = "Self-hosted Polymarket bot platform with secure wallet management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Backend
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "redis>=5.0.0",

    # Crypto & Wallet
    "eth-account>=0.10.0",
    "eth-keys>=0.4.0",
    "mnemonic>=0.20",
    "py-clob-client>=0.34.6",

    # AWS (for KMS)
    "boto3>=1.34.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Shared with polyautomate
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "signer", "executor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
